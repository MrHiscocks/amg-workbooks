n"],"unit":"ROUTE","html":"<div class=\"full content\"><div class=\"eyebrow\">How to use this reference</div><h1>Choose the operation that matches the stretch needed</h1><p class=\"lead\">Use these after the corresponding core unit, as targeted extension or as a compact revision route.</p><table class=\"mission-table\"><thead><tr><th>Operation</th><th>Best fit</th><th>Students will extend</th></tr></thead><tbody><tr><td style=\"border-left-color:#18e77a\">Identity Ops</td><td>Strings and calculations</td><td>slicing, redaction, percentage deductions</td></tr><tr><td style=\"border-left-color:#27d3e8\">Logic Ops</td><td>Precise decision systems</td><td>compound conditions, grouped rules, random outcomes</td></tr><tr><td style=\"border-left-color:#8b6cf6\">Iteration Ops</td><td>Repeated processing</td><td>modulo loops, accumulators, generated patterns</td></tr></tbody></table><div class=\"callout\"><strong>Keep the challenge intact:</strong> prompt with questions and test cases before giving finished code.</div></div>","support":"<article class=\"support-block\"><small>Talk track</small><h3>What to say</h3><p>Use the table to route learners. A student does not need to complete all three in one sitting for the reference to be useful.</p></article><article class=\"support-block\"><small>Watch for</small><h3>Likely sticking point</h3><p>If a student cannot explain the linked core idea, pause the Black Ops mission and retrieve that knowledge first.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>The selected operation matches a clear learning need rather than simply filling time.</p></article>"},{"title":"Identity Ops","theme":"tint","badge":"identity","unit":"IDENTITY OPS","style":{"accent":"#18e77a","accentDark":"#087a45","accentSoft":"#e9fff2"},"html":"<div class=\"split content\"><div class=\"copy\"><div class=\"eyebrow\">Identity Ops · Unit 1 extension</div><h1>Extract, sanitise and calculate</h1><p class=\"lead unit":"LOGIC OPS","style":{"accent":"#27d3e8","accentDark":"#087d96","accentSoft":"#eafcfe"},"html":"<div class=\"split equal content\"><div class=\"copy\"><div class=\"eyebrow\">Logic Ops · quick reference</div><h1>Group the rule, then test its edges</h1><div class=\"note-stack\" style=\"margin-top:18px\"><div class=\"note\"><b>Coordinates</b><p>Check <code>x == 0 or y == 0</code> before any quadrant.</p></div><div class=\"note\"><b>Leap years</b><p>Divisible by 4, except centuries unless divisible by 400.</p></div><div class=\"note\"><b>Rock, Paper, Scissors</b><p>Check a draw first, then group all three winning combinations.</p></div></div></div><div class=\"side\"><div class=\"code-shell\"><div class=\"code-head\"><span>logic_ops_reference.py</span><span>Python</span></div><pre class=\"code\"><code><span class=\"tok-key\">if</span> x == <span class=\"tok-num\">0</span> <span class=\"tok-key\">or</span> y == <span class=\"tok-num\">0</span>:\n    <span class=\"tok-fn\">print</span>(\"ON BORDER\")\n<span class=\"tok-key\">elif</span> x &gt; <span class=\"tok-num\">0</span> <span class=\"tok-key\">and</span> y &gt; <span class=\"tok-num\">0</span>:\n    <span class=\"tok-fn\">print</span>(\"NE QUADRANT\")\n\nis_leap = year % <span class=\"tok-num\">4</span> == <span class=\"tok-num\">0</span> <span class=\"tok-key\">and</span> (\n    year % <span class=\"tok-num\">100</span> != <span class=\"tok-num\">0</span> <span class=\"tok-key\">or</span> year % <span class=\"tok-num\">400</span> == <span class=\"tok-num\">0</span>\n)\n\n<span class=\"tok-key\">if</span> agent == drone:\n    <span class=\"tok-fn\">print</span>(\"DRAW\")</code></pre></div><img class=\"corner-art\" style=\"top:auto;bottom:-12px;right:-4px\" src=\"data:image/webp;base64,UklGRn5CAABXRUJQVlA4WAoAAAAQAAAAPwEAPwEAQUxQSPsGAAABsEDbtilJ1nnhSJRt27Zt27Zt27Zt27aNtG1FvHfHyOr+PzPi3XPuZ0QE2rZtYx7Q1TCKHADYMZpA6GjK7zpQRStwyTXHizG/JflELa59XsssmfJhcDoRi77++Xj2N4nXmhpEK1KxDcHsHwrfXloSqmSe8ENh/4z7tOziFHOHBxaWAtZn3Z 3><p>Use a three-row trace for the accumulator or pattern. Keep the student in control of the next line.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>The loop covers the intended range, updates state correctly and produces the required number of outputs.</p></article>"},{"title":"Iteration Ops reference","theme":"paper","badge":"iteration","unit":"ITERATION OPS","style":{"accent":"#8b6cf6","accentDark":"#5439c8","accentSoft":"#f2eeff"},"html":"<div class=\"split equal content\"><div class=\"copy\"><div class=\"eyebrow\">Iteration Ops · quick reference</div><h1>Start values and stop values matter</h1><div class=\"note-stack\" style=\"margin-top:18px\"><div class=\"note\"><b>FizzBuzz</b><p><code>range(1, 51)</code> includes 50. Check the combined 3-and-5 case first.</p></div><div class=\"note\"><b>Factorial</b><p>Start a multiplicative accumulator at 1, then multiply by each loop value.</p></div><div class=\"note\"><b>Pyramid</b><p>Use <code>height + 1</code> and print <code>\"*\" * row</code> inside the loop.</p></div></div></div><div class=\"side\"><div class=\"code-shell\"><div class=\"code-head\"><span>iteration_ops_reference.py</span><span>Python</span></div><pre class=\"code\"><code><span class=\"tok-key\">for</span> number <span class=\"tok-key\">in</span> <span class=\"tok-fn\">range</span>(<span class=\"tok-num\">1</span>, <span class=\"tok-num\">51</span>):\n    <span class=\"tok-key\">if</span> number % <span class=\"tok-num\">3</span> == <span class=\"tok-num\">0</span> <span class=\"tok-key\">and</span> number % <span class=\"tok-num\">5</span> == <span class=\"tok-num\">0</span>:\n        <span class=\"tok-fn\">print</span>(\"FIZZBUZZ\")\n\nfactorial = <span class=\"tok-num\">1</span>\n<span class=\"tok-key\">for</span> factor <span class=\"tok-key\">in</span> <span class=\"tok-fn\">range</span>(value, <span class=\"tok-num\">0</span>, -<span class=\"tok-num\">1</span>):\n    factorial = factorial * factor\n\n<span class=\"tok-key\">for</span> row <span class=\"tok-key\">in</span> <span class=\"tok-fn\">range</span>(<span class=\"tok-num\">1</span>, height + <span class=\"tok-num\">1</span>):\n    <span class=\"tok-fn\">print</span>(\"*\" * row)</code></pre></div><img class=\"corner-art\" style=\"top:auto;bottom:-12px;right:-4px\" src=\"data:image/webp;base64,UklGRlA9AABXRUJQVlA4WAoAAAAQAAAAPwEAPwEAQUxQSPsGAAABsEDbtilJ1nnhSJRt27Zt27Zt27Zt27aNtG1FvHfHyOr+PzPi3XPuZ0QE2rZtYx7Q1TCKHADYMZpA6GjK7zpQRStwyTXHizG/JflELa59XsssmfJhcDoRi77++Xj2N4nXmhpEK1KxDcHsHwrfXloSqmSe8ENh/4z7tOziFHOHBxaWAtZn3ZzFKNoqh6NZCsWeqqUToORb7MdSIXBVIdFJukEfZJYqypeRGUUmhiZXE1iqJd1uZRKWrlRqexizici95TVCkuzT3JjNeM3JJR5x7vbUymxIftXHVSyiq3kyltlY/Pl6eoFIoZWBzA5CNhSVBCEZRn5RmF0oP8ZnFoGYWt1OYnZjud/eTP+wvTeS2VX0IeJn8VxzvZjd+S7KS/mw/UpmKiC/G5SW8GFbJRKuNDaQPGyHMBUJ21pKIjZZxv9gKuM2JRu5w7bqWJ90cSZ12Fal2BM1tCQm72JfploBKwoSOGwPfi8zFVM+D89A4LCtcok3WxgpG7a3hTEOROwupyFs2OaE5+ycNA3bz6yMG/LLXi4kDdtciTtbR0/KIwVXBTLuBK8rItEybHNI+T42EyHDNqcs99qaiRi2ORZ1sJKGgJ/TnPNZkAf9YZt78tsBaM/i+nrn4xkKEi41RLlDSUU3BDM0hG4ugW+Hyjz+h8Iw8WtyVmSH7fYPLAwZlsednRAdtisfjmYIiTleTYvoz2mk+C/Lj+PP6fcyQ4vyaWh6FIdt1CTeaGZEb9hGT8TOMhq0km2aG0ORx4wciP2cRpL1eQ8XpIZtRMWdqa1DJgVXBjBkBa0pjMqwPeKzwtClfB2dEY1hu+XtJIaypLttTCgM2+X2RjK0Re2voEFh2Ead97zcCAzbyJPf9EvD+bBNgPiLDfS8/pxeH8KIELqxuMTnsM0I8XNiFi6HbVJYHnZ04m7YJkfMkaparn5OE4SjA2lp/wzbBPn7gTROhm3CJFxrauBg2CZO+A5VH0jLNtWNUYSfA2nOXZ9aGYmsz7q5qHbYJlPsqZo6FQ7bgYwgHB1IyzDys8IIws+BNGOrW0mMIPwcSNOU3xPJCGK7A2kqGbYJ5zU3lyqGbYLY+kCa3YdtgvBzIE0quiGEEcReB9Ls93OaIPwcSNO1fWBhAsHyoK3O1snzkwmGn3lsnfxeohGv/DaPp2jE0+F/HP7H4X8c/sfhfxz+x+F/HP7H4X8c/sfhfxz+5z86yftbNPI7r61j6PbMKhKxPutmAJvLNumHIgpRfkzKBvYgFV0dIAYJXFNUAjvRVT8STX+ij1TXgR2Z295OpD2Jt9uawc4yDH0n0x35/dAMoAJ55pHdQT3n5wV10JTdHkpxwnaU1YBqGBqej6M2cRcaGkBVXLs/sdDa03u4gupknfCdzB6vfJ+YDdRIKrLSn8YErCoigUppqx2Koi9Rh6vpQMXMrW8S1+MTb7Uxg8qlH/yWsB4vvxuSHjiQe44HWT19Xh7gg6b01lCKErq9jAa4Yah/lpweH3eugQG44tL1sYWSWJ50dwXuZBn3lYwer3ybkBV4JBVa4UdD/P/0dE5pqx6IJKCnH6qmBY6ZWt5IwL6ntzYD5
