<body><div class="app"><header class="topbar"><div class="brand"><img class="top-badge" id="topBadge" alt=""><span class="top-badge-row" id="topBadgeRow"></span><span>THE AGENCY</span></div><div class="unit"><strong id="unitLabel"></strong><span>·</span><span>OPERATION EXAMINER</span></div><div class="actions"><button class="chrome" id="supportBtn" type="button" title="Open teacher support"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.7 9a2.5 2.5 0 0 1 4.8 1c0 2-2.5 2.2-2.5 4M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Support</span></button><button class="chrome primary" id="presentBtn" type="button" title="Enter full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m9 21 3-4 3 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Present</span></button></div></header><main class="stage" id="stage" aria-live="polite"></main><footer class="footer"><button class="nav" id="prevBtn" type="button">← Previous</button><div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="progress-text" id="progressText"></div></div><button class="nav next" id="nextBtn" type="button">Next →</button></footer></div>

he Brute Force</small><h2>Control repetition</h2></div><ul class=\"ticks\"><li><span><code>for</code> and <code>while</code> patterns</span></li><li><span>counters and accumulators</span></li><li><span>trace, test and refine</span></li></ul></article></div><div class=\"callout\"><strong>Teacher cue:</strong> a repeated question block is acceptable. Repetition earns value only when it makes the solution clearer and remains reliable.</div></div>","support":"<article class=\"support-block\"><small>Talk track</small><h3>What to say</h3><p>Give the class sixty seconds to name one useful technique from each workbook before showing the slide.</p></article><article class=\"support-block\"><small>Watch for</small><h3>Likely sticking point</h3><p>Students may assume they must use a loop because Unit 3 is included. The rubric rewards a working, explainable solution.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>Students identify input, selection and a correctly initialised score as the essential core.</p></article>"},{"title":"Assessment at a glance","theme":"paper","badge":"secure","unit":"BRIEF","html":"<div class=\"full content\"><div class=\"eyebrow\">Assessment at a glance</div><h1>One product, five visible outcomes</h1><p class=\"lead\">Keep the non-negotiables visible while students plan.</p><div class=\"grid3\"><div class=\"metric\"><b>10</b><span>appropriate computing or Python questions</span></div><div class=\"metric\"><b>A–C</b><span>three clearly labelled choices for every question</span></div><div class=\"metric\"><b>1</b><span>stored correct answer and clear check per question</span></div><div class=\"metric\"><b>+1</b><span>score increases only when the answer is correct</span></div><div class=\"metric\"><b>/10</b><span>final score displayed clearly at the end</span></div><div class=\"metric\"><b>3</b><span>purposeful test runs recorded and reviewed</span></div></div><div class=\"callout\"><strong>Keep it assessable:</strong> title, questions, choices, feedback and final score should be easy for another person to follow.</div></div>","support":"<article class=\"support-block\"><small>Talk track</small><h3>What to say</h3><p>Read the product outcomes as a contract for the assessment. Students can use them as their build checklist.</p></article><article class=\"support-block\"><small>Watch for</small><h3>Likely sticking point</h3><p>A correct program can still lose clarity if choices are not labelled or the final score is buried in other output.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>A plan shows ten question topics and the intended answer for each before coding begins.</p></article>"},{"title":"Dependable code pattern","theme":"paper","badge":"secure","unit":"BUILD","html":"<div class=\"split equal content\"><div class=\"copy\"><div class=\"eyebrow\">Dependable pattern</div><h1>Initialise once, then repeat the check</h1><p class=\"lead\">This pattern is deliberately simple, readable and easy to test.</p><div class=\"note-stack\" style=\"margin-top:18px\"><div class=\"note\"><b>Before question 1</b><p>Set <code>score = 0</code> once.</p></div><div class=\"note\"><b>For every question</b><p>Display A/B/C, collect a response, check it, give feedback and update only the correct route.</p></div><div class=\"note\"><b>After question 10</b><p>Display one final score out of ten.</p></div></div></div><div class=\"side\"><div class=\"code-shell\"><div class=\"code-head\"><span>operation_examiner.py</span><span>Python · colour coded · 4-space indentation</span></div><pre class=\"code\"><code>score = <span class=\"tok-num\">0</span>\n\n<span class=\"tok-fn\">print</span>(\"Q1. Which command displays output?\")\n<span class=\"tok-fn\">print</span>(\"A. input\")\n<span class=\"tok-fn\">print</span>(\"B. print\")\n<span class=\"tok-fn\">print</span>(\"C. range\")\nanswer = <span class=\"tok-fn\">input</span>(\"Your answer: \").upper()\n\n<span class=\"tok-key\">if</span> answer == \"B\":\n    <span class=\"tok-fn\">print</span>(\"Correct\")\n    score += <span class=\"tok-num\">1</span>\n<span class=\"tok-key\">else</span>:\n    <span class=\"tok-fn\">print</span>(\"Not quite\")\n\n<span class=\"tok-comment\"># Repeat the pattern <span class=\"tok-key\">for</span> Q2 to Q10</span>\n<span class=\"tok-fn\">print</span>(f\"Final score: {score}/<span class=\"tok-num\">10</span>\")</code></pre></div></div></div>","support":"<article class=\"support-block\"><small>Talk track</small><h3>What to say</h3><p>Model the lifecycle of the score variable: create once, update conditionally, report once.</p></article><article class=\"support-block\"><small>Watch for</small><h3>Likely sticking point</h3><p>The most damaging error is placing <code>score = 0</code> inside a question block, which erases earlier marks.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>Ask a student to point to the only line that changes the score and explain when it runs.</p></article>"},{"title":"Assessment criteria","theme":"tint","badge":"secure","unit":"CRITERIA","html":"<div class=\"full content\"><div class=\"eyebrow\">Assessment criteria · 12 marks</div><h1>Four strands, each judged from 0 to 3</h1><p class=\"lead\">The strongest work is complete, accurate, readable and supported by evidence of testing.</p><div class=\"grid4\"><article class=\"card\"><div class=\"number\"><strong>01</strong><span>/3</span></div><h3>Program construction</h3><p>A complete ten-question program with clear structure and suitable Python.</p></article><article class=\"card\"><div class=\"number\"><strong>02</strong><span>/3</span></div><h3>Selection and scoring</h3><p>Correct checks, reliable branching and a score that changes only on correct answers.</p></article><article class=\"card\"><div class=\"number\"><strong>03</strong><span>/3</span></div><h3>Accuracy and user experienc ll><h2>Independent decisions</h2><p>Students choose question content, variable names, feedback and test cases, and can explain those choices.</p></article><article class=\"card\"><small>Record</small><h2>Honest evidence</h2><p>Tests include failed outcomes and fixes where they occur. The debrief identifies a specific improvement.</p></article></div><div class=\"callout\"><strong>Before starting:</strong> state the time limit, permitted support and submission route for your class.</div></div>","support":"<article class=\"support-block\"><small>Talk track</small><h3>What to say</h3><p>Make local conditions explicit before the timer starts. This slide deliberately leaves timing and submission route for the teacher to set.</p></article><article class=\"support-block\"><small>Watch for</small><h3>Likely sticking point</h3><p>Open-book does not mean copying an entire solution without understanding or submitting shared work.</p></article><article class=\"support-block\"><small>Quick check</small><h3>Evidence to look for</h3><p>Students know what may be consulted, what must be independent and where the final file will be submitted.</p></article>"},{"title":"Submission checklist","theme":"tint","badge":"secure","unit":"SUBMIT","html":"<div class=\"full content\"><div class=\"eyebrow\">Submission checklist</div><h1>Nothing missing from the evidence pack</h1><p class=\"lead\">Use this final check before the assessment is handed in.</p><div class=\"grid2\"><article class=\"card\"><ul class=\"ticks\"><li><span>name or Agent ID is present</span></li><li><span>ten complete A/B/C questions</span></li><li><span>final score is shown out of ten</span></li><li><span>three purposeful tests are recorded</span></li></ul></article><article class=\"card with-corner\"><img class=\"corner-art\" src=\"data:image/webp;base64,UklGRoxVAABXRUJQVlA4WAoAAAAQAAAAZwEAZwEAQUxQSC8UAAABHAVt2zBN+bPuLoOImACtgY4y6O0nN6IdqQb06w3btsVts207R2YKL43DKTMzBezETmyXmZkZUmZmhqvMzMycLsFyG4ZiwLFlSY4ta859P/RjRKPB5foVERNA
